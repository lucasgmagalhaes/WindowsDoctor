name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p diskscan -p systools

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test -p diskscan -p systools
      - name: Smoke test of diagnostics on real Windows (read only)
        run: cargo run -p systools --example smoke
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windowsdoctor-instaladores
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/windows-folder-map.exe
