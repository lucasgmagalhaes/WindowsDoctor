[package]
name = "windows-folder-map"
version = "0.1.0"
description = "Mapa de disco, limpeza, diagnóstico e otimizações do Windows"
edition = "2021"

[lib]
name = "windows_folder_map_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
diskscan = { path = "../crates/diskscan" }
systools = { path = "../crates/systools" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
trash = "5"
