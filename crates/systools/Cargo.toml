[package]
name = "systools"
version = "0.1.0"
edition = "2021"
description = "Limpeza, diagnóstico e otimizações do Windows"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
