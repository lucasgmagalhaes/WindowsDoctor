[package]
name = "systools"
version = "0.1.0"
edition = "2021"
description = "Diagnóstico, otimizações e histórico do Windows"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Devices_Display", "Win32_Graphics_Gdi"] }
